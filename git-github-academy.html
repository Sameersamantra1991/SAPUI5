<body>
<header>
<button class="hbtn" id="menuBtn" aria-label="Open course menu">☰</button>
<div class="logo" aria-hidden="true">🐙</div>
<h1>GitHub Visual Academy <small>— zero → team workflow</small></h1>
<div class="hspace"></div>
<input id="search" placeholder="🔍 Search: branch, rebase, fork…" aria-label="Search course">
<select id="modeSel" class="hbtn" aria-label="Explanation level"><option value="beginner">👶 Beginner</option><option value="dev">🧑 Developer</option><option value="expert">🧠 Expert</option></select>
<button class="hbtn" id="motionBtn" title="Reduce motion">♿</button>

<div class="legend">👨‍💻 Developer · 📁 File · 🌿 Branch · 💾 Commit · ☁ GitHub · 🔀 PR · 👀 Review · 🤖 CI · ✅ Approved · ❌ Failed · ⚠ Conflict · 🚀 Deploy · 🔒 Protected</div>
</aside>
<main id="content" tabindex="-1"></main>
</div>
<footer>
<button class="hbtn" id="prevBtn">← Previous</button>
<button class="hbtn" id="nextBtn" style="margin-left:auto">Next →</button>
</footer>
<script>
/* ================= progressManager ================= */
const store={get:(k,d)=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set:(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let done=store.get('gga-done',[]);
let MODE=store.get('gga-mode','beginner');
/* ================= courseData ================= */
const TEAM=[{n:'Samir',r:'owner',c:'#6e40c9'},{n:'Nagarjun',r:'feature/order',c:'#1f883d'},{n:'Priya',r:'feature/payment',c:'#9e6a03'},{n:'Rahul',r:'feature/login',c:'#0a3069'},{n:'Ananya',r:'feature/reporting',c:'#a40e26'},{n:'Vikram',r:'bugfix/invoice',c:'#055d20'}];
const GLOSSARY=[["Git","Notebook/history system on your computer. Tracks every save (commit)."],["GitHub","Shared online warehouse for Git repos + PRs, issues, actions."],["repository","Project folder with history (.git)."],["remote","Another repo copy, usually on GitHub."],["origin","Default nickname for the main remote."],["clone","Download a full remote repo copy to your laptop."],["commit","Game checkpoint: snapshot + message + author + parent ID."],["branch","Separate road for safe work. A movable pointer to a commit."],["merge","Combine one branch into another."],["rebase","Replay your commits on top of newer main. Clean line, rewrites IDs."],["pull","fetch + merge into your current branch."],["push","Upload your commits to GitHub."],["fetch","Download remote info only. Your files don't change."],["fork","Your own server-side copy of someone else's project."],["pull request","Raising your hand: please check + merge my branch."],["review","Teacher checking homework: approve / comment / request changes."],["maintainer","Teacher/owner who can merge."],["contributor","Student sending homework (PRs)."],["organization","School containing teams + repos."],["team","Group of developers with shared repo access."],["issue","Task ticket, e.g. Issue #123."],["CODEOWNERS","File mapping folders → required reviewer teams."],["CI","Robot checking homework automatically (tests, lint)."],["CD","Robot delivering homework to servers."],["workflow","Automated recipe in .github/workflows."],["action","One automation step (e.g. run tests)."],["artifact","Packed build output (zip) ready to deploy."],["deployment","Shipping artifact to Dev/QA/Staging/Production."],["staging","Dress rehearsal server, copy of production."],["production","Live app real users touch."],["tag","Sticky label on a commit, e.g. v1.0.0."],["release","Packed version + notes for users."],["conflict","Two students edited the same line. Git asks you to choose."],["protected branch","Locked main: no direct push, needs PR + review + CI."],["squash","Squish many commits into one clean commit on merge."],["cherry-pick","Copy one commit onto another branch."],["stash","Drawer: hide unfinished work temporarily."],["reset","Move branch pointer (can erase history — dangerous)."],["revert","New commit that undoes an old one (safe)."],["HEAD","You-are-here pointer: current commit."],["working tree","Your open files on disk."],["staging area","Lunch tray: files queued for next commit (git add)."],["hotfix","Emergency ambulance branch to fix production."],["semantic versioning","Major.Minor.Patch, e.g. 1.4.2."],["monorepo","One repo holding many projects."],["multi-repo","Each project has its own repo."],["secret scanning","Robot hunting leaked passwords/keys."],["stash2","see stash"],["approval","Reviewer clicks Approve — required green gate before merge."],["requested changes","Reviewer asks for fixes; merge blocked until re-review."],["permissions","Who can read/write/merge: Owner, Maintainer, Write, Triage, Read."],["branch protection","Rules locking main: no direct/force push, needs PR + reviews + green checks."],["open source","Public project anyone can fork + PR; maintainers + CI guard quality."],["build","Compiling/tests packing code into a runnable artifact."],["development","Messy playground env for daily coding."],["QA","Testers verify the build before staging."],["dependency scanning","Robot checking libraries for known vulnerabilities."],["SAST","Static code analysis robot finding bugs/security flaws."],["container scan","Robot checking Docker images for vulnerabilities."],["draft PR","Work-in-progress PR, clearly not ready to merge."],["HEAD","You-are-here pointer to the current commit/branch."],["working tree","Your open editable files on disk."],["staging area","Tray of files queued for the next commit via git add."],["hotfix","Emergency branch from main to fix production fast."],["semantic versioning","Major.Minor.Patch versioning, e.g. 1.4.2."]];
const COMPARISONS=[["Git vs GitHub","Git = notebook/history on your PC. GitHub = shared warehouse online + collaboration (PRs, issues, actions)."],["Clone vs Fork","Clone = download to laptop. Fork = server-side copy under YOUR GitHub account (for outsiders)."],["Pull vs Fetch","Fetch = peek at warehouse, files unchanged. Pull = fetch + merge into your branch."],["Merge vs Rebase","Merge = join roads with a merge commit (keeps history). Rebase = replay your road on top of main (straight line, rewrites IDs)."],["Reset vs Revert","Reset = time-travel pointer (dangerous, erases). Revert = new undo-commit (safe for shared branches)."],["Branch vs Repository","Repo = whole notebook. Branch = one storyline/road inside it."],["Commit vs Push","Commit = save checkpoint locally. Push = upload checkpoints to GitHub."],["PR vs Merge","PR = request + discussion + checks. Merge = the actual combining action."],["CI vs CD","CI = robot tests every PR. CD = robot ships approved code to servers."],["Dev vs Staging vs Production","Dev = messy playground. Staging = rehearsal clone. Production = live stage."]];
const CAPSTONE=[["Nagarjun made a feature branch. Push it straight to protected main?",["B"],["A. Yes","B. No — open a PR","C. Only at night","D. Delete main"],"Protected main blocks direct push; PR + review + CI required."],["What does git fetch do?",["B"],["A. Uploads commits","B. Downloads remote info, files unchanged","C. Deletes branch","D. Deploys"],"Fetch only updates remote-tracking info."],["Merge conflict = ?",["C"],["A. Server down","B. CI failed","C. Same lines edited differently","D. Wrong password"],"Resolve by choosing A/B/both, then add+commit."],["Fork is needed when…",["B"],["A. You own the repo","B. You lack push permission (outsider)","C. CI passes","D. Never"],"Fork creates your own server copy, then PR back."],["Squash merge does…",["C"],["A. Deletes main","B. Creates conflict","C. Combines many commits into one","D. Skips CI"],"Keeps main history clean."],["Rebase rewrites…",["B"],["A. Nothing","B. Commit IDs (replays D,E as D',E')","C. GitHub password","D. Issues"],"Never rebase shared/public history."],["CODEOWNERS notifies…",["A"],["A. Owning team for changed folder","B. Nobody","C. Bots only","D. All 300 devs"],"e.g. /payment/ → @payment-team review required."],["v2.1.3 → which is patch?",["C"],["A. 2","B. 1","C. 3","D. None"],"Major.Minor.Patch."],["git stash is for…",["B"],["A. Deploying","B. Hiding unfinished work to switch branches","C. Merging","D. Forking"],"stash → switch → fix → pop."],["git revert vs reset?",["B"],["A. Same","B. Revert = safe new undo-commit; reset = move pointer (dangerous)","C. Reset is safer","D. Neither exists"],"Use revert on shared branches."],["Draft PR means…",["B"],["A. Ready to merge","B. Work in progress, not ready","C. Merged","D. Closed"],"Convert to ready when done."],["Who approves in OSS?",["C"],["A. Anyone","B. Bots","C. Maintainers","D. Nobody"],"Maintainers + CODEOWNERS + CI."],["Direct push to 🔒main?",["B"],["A. Allowed","B. Blocked — use feature branch + PR","C. Allowed Fridays","D. Allowed with --force"],"Branch protection blocks it."],["CI fails → PR?",["B"],["A. Can merge anyway","B. Blocked until green","C. Auto-deletes","D. Merges faster"],"Fix code, push, CI reruns."],["Hotfix branches from…",["A"],["A. main (production bug), fast-track PR","B. Random commit","C. Deleted branch","D. Fork only"],"Emergency lane to production."],["Monorepo =",["A"],["A. One repo, many projects","B. Many repos","C. No repos","D. Only docs"],"Trade-off vs multi-repo."],["Fixes #123 in PR does…",["B"],["A. Nothing","B. Auto-links/closes issue on merge","C. Deletes issue","D. Opens new repo"],"Keywords: Fixes/Closes/Resolves."],["Secret scanning finds…",["C"],["A. Typos","B. Slow tests","C. Leaked keys/passwords","D. Merge commits"],"Blocks risky PRs."],["Artifact is…",["B"],["A. Source code","B. Build output packed for deploy","C. A branch","D. A commit"],"Build → artifact → Dev→QA→Staging→Prod."],["Best first step for a task?",["B"],["A. Edit main directly","B. Pull latest main, create feature branch","C. Force push","D. Delete .git"],"Small safe road, then PR."]];
/* Lessons: id, num, title, analogy, pipe steps, body, cmds, team, mistake, quiz, happened */
const LESSONS=[
{id:'m01',num:'01',title:'What is Git? The final_final.zip problem',analogy:'Without Git your project is a pile of renamed zip files. Git is one notebook that remembers every save.',pipe:['Edit app.js','Copy app-final2.js','Chaos 😱','Git init','Commit 1→4 ✅'],body:'<b>Source code</b> = text files the computer runs. <b>Version control</b> = remembering every change. Without Git you copy files manually and lose track. <b>Git</b> stores snapshots as <span class="kbd">Commit 1 → 2 → 3 → 4</span> with messages, so you can time-travel. <b>Git vs GitHub:</b> Git is the notebook, GitHub is the shared warehouse. GitLab/Bitbucket are other warehouses.',cmds:['git init','git status'],team:'Solo dev Priya stops making final_really_final.zip and uses commits instead.',mistake:'Copying files instead of committing — you lose who/why/when.',quiz:{q:'Why is app-final-really-final.js bad?',o:['A. Too long','B. No history/identity — use commits','C. JS is bad','D. GitHub dislikes JS'],a:1,w:'Commits store author, message, parent and diff.'},happened:'git init creates a .git folder (objects + refs). Each commit stores a snapshot + parent pointer, forming a chain.'},
{id:'m02',num:'02',title:'Git vs GitHub: notebook vs warehouse',analogy:'Git = your personal notebook. GitHub = the school warehouse where everyone exchanges notebooks.',pipe:['Local repo 💻','git push ⬆','GitHub ☁','git pull ⬇','In sync ✅'],body:'<b>Local repo</b> lives on your PC. <b>Remote repo</b> lives on GitHub. <b>origin</b> = nickname of the main remote. <b>clone</b> = first download. <b>push</b> = upload commits. <b>pull</b> = download + merge. <b>fetch</b> = download info only.',cmds:['git clone <url>','git remote -v','git push','git pull'],team:'Rahul clones once, then push/pull daily. origin points to GitHub.',mistake:'Thinking GitHub IS Git. Git works offline; GitHub needs internet.',quiz:{q:'Git vs GitHub?',o:['A. Same thing','B. Git=local history, GitHub=remote platform','C. GitHub replaces Git','D. Git needs internet'],a:1,w:'Git tracks locally; GitHub hosts + collaborates.'},happened:'Push sends local Git objects over HTTPS/SSH; GitHub updates the remote branch ref.'},
{id:'m03',num:'03',title:'Repository tour: click everything',analogy:'A repo is a school locker: code folders + notice board (issues/PRs) + gym (actions).',pipe:['README 📖','src/ 💻','Tests ✅','.github 🤖','Releases 🏷'],body:'Click the locker items in the animation: <b>README</b> = front page, <b>src</b> = code, <b>test</b> = homework checker, <b>.gitignore</b> = do-not-pack list, <b>.github</b> = robots + templates, <b>branches/tags/releases/issues/PRs/actions</b> live on top.',cmds:['ls','cat README.md'],team:'Samir adds README + issue templates so 6 devs know the rules.',mistake:'Committing passwords/node_modules — use .gitignore + secret scan.',quiz:{q:'What is .gitignore?',o:['A. Ignore teammates','B. List of files Git must skip','C. Ignore CI','D. Delete repo'],a:1,w:'e.g. node_modules, .env, secrets.'},happened:'A repo = working files + .git (objects, refs, HEAD) + GitHub metadata (issues, PRs).'},
{id:'m04',num:'04',title:'The 4 Areas: where is my file?',analogy:'Clothes journey: bedroom floor (working) → laundry basket (staging) → wardrobe (local repo) → warehouse (GitHub).',pipe:['Working tree ✏','git add → Staging 📦','git commit → Local 💾','git push → GitHub ☁'],body:'<b>Working tree</b> = your edits. <b>Staging area</b> = tray of files for next commit. <b>Local repo</b> = committed history. <b>Remote</b> = GitHub copy. Use the buttons: Edit → Add → Commit → Push and watch the file travel.',cmds:['git status','git add .','git commit -m "msg"','git push'],team:'Ananya learns: red (modified) → green (staged) → committed → pushed.',mistake:'git commit with empty staging = nothing committed. Stage first!',quiz:{q:'File edited but not added. git commit does?',o:['A. Commits it','B. Nothing — stage with git add first','C. Pushes','D. Deletes'],a:1,w:'Only staged files enter the commit.'},happened:'add copies file blobs to index; commit creates commit object pointing to tree + parent.'},
{id:'m05',num:'05',title:'First project: terminal simulator',analogy:'Learning to drive: one pedal at a time, instructor shows what moved.',pipe:['git init 🆕','git add ➕','git commit 💾','git push ⬆','git log 📜'],body:'Press <b>Run</b> on each command card. Watch the internal effect text. Order: init → status → add → commit → log → remote add → push.',cmds:['git init','git add .','git commit -m "Initial commit"','git log','git push -u origin main'],team:'Vikram runs the 7 commands and sees his code appear on GitHub.',mistake:'push before commit — nothing to upload.',quiz:{q:'After git add, where is the file?',o:['A. GitHub','B. Staging area','C. Production','D. Deleted'],a:1,w:'add → staging; commit → local history.'},happened:'init makes .git; add fills index; commit appends to branch ref; push syncs remote ref.'},
{id:'m06',num:'06',title:'Commits: game checkpoints',analogy:'Each commit is a saved game: reload anytime, see who saved and what changed.',pipe:['C1 author+msg','C2 parent=C1','C3 files+time','Click nodes 👆','New commit ✨'],body:'Click C1–C4. Each shows <b>ID, parent, author, message, files, time</b>. A commit = snapshot, not a diff. History is a linked list. New commits point to their parent.',cmds:['git log --oneline','git show <id>'],team:'Nagarjun clicks C3 to prove his validation change is inside.',mistake:'Empty messages like "fix". Write what + why.',quiz:{q:'What links C3 to C2?',o:['A. WiFi','B. Parent pointer','C. PR number','D. Nothing'],a:1,w:'Each commit stores its parent ID.'},happened:'Commit object: tree hash + parent hash + author + message → SHA ID.'},
{id:'m07',num:'07',title:'Branches: separate safe roads',analogy:'Main road stays clean. Build your shop on a side road (branch), merge when ready.',pipe:['main C1→C3','New branch 🌿','C4→C5 on branch','Switch ↔','Merge-ready ✅'],body:'A <b>branch</b> is a movable sticker (pointer) on a commit. <span class="kbd">git branch feature/login</span> creates it, <span class="kbd">git switch</span> moves HEAD. Commits grow on whichever branch HEAD points to.',cmds:['git branch feature/login','git switch feature/login','git switch -c feature/x'],team:'Rahul branches feature/login off main at C3; main untouched.',mistake:'Committing on main directly in a team — branch first.',quiz:{q:'A branch is…?',o:['A. File copy','B. Movable pointer to a commit','C. A server','D. A PR'],a:1,w:'Pointer that advances with each commit.'},happened:'Branch = ref file (e.g. refs/heads/main) holding a commit SHA; switch updates HEAD.'},
{id:'m08',num:'08',title:'WHY branches? 3 devs at once',analogy:'Three cooks, three kitchens. Nobody burns the main dish.',pipe:['main ●','A: login 🍳','B: payment 🍳','C: cart 🐞','Isolated ✅'],body:'<b>Developer A/B/C</b> each branch off main and work in parallel. They do NOT edit the same branch. Isolation = no stepping on toes. Merge later via PRs.',cmds:['git switch -c feature/payment'],team:'Login, payment, cart features cook simultaneously, main stays servable.',mistake:'Two devs pushing to the same feature branch without pulling — diverge!',quiz:{q:'Should devs share one branch normally?',o:['A. Yes always','B. No — one branch per task','C. Only nights','D. Yes, main'],a:1,w:'Isolate work, integrate via PR.'},happened:'Each branch ref advances independently; Git merges by finding common ancestor.'},
{id:'m09',num:'09',title:'Team of 6: clone → PR → merge',analogy:'Homework flow: copy notebook (clone) → side page (branch) → raise hand (PR) → teacher checks (review+CI) → paste into class book (merge).',pipe:['Clone 📥','Branch 🌿','Commit 💾','Push ⬆','PR 🔀','CI 🤖','Approve ✅','Merge 🎉'],body:'Samir owns main. Each dev: clone → branch → code → commit → push → PR → review + CI → fix → approve → merge → delete branch. Press Play and follow the avatars.',cmds:['git clone','git push -u origin feature/order'],team:'Nagarjun(order) Priya(payment) Rahul(login) Ananya(reporting) Vikram(invoice) orbit Samir.',mistake:'Forgetting to pull main before branching — stale base.',quiz:{q:'First step for a new task?',o:['A. Edit main','B. Pull main + create feature branch','C. Delete repo','D. Force push'],a:1,w:'Fresh base prevents conflicts.'},happened:'Push creates remote branch; GitHub diffs it vs main, triggers checks + reviewer alerts.'},
{id:'m10',num:'10',title:'Full pipeline: dev → production',analogy:'Parcel journey: home → post office (GitHub) → X-ray (CI) → signature (approval) → truck (deploy) → customer (prod).',pipe:['Dev 💻','Push ⬆','PR 🔀','CI 🤖','Approve ✅','main 🌿','Build 🏗','Dev→QA→Stage→Prod 🚀'],body:'Use <b>Play Full Workflow</b> + speed + step buttons. Stages: clone → branch → add/commit/push → PR → review → CI (lint/tests/security/build) → approval → merge → artifact → Dev → QA → Staging → Production.',cmds:['git push','gh pr create'],team:'One parcel (supplier-risk) travels all belts without getting lost.',mistake:'Skipping staging — bugs meet real users.',quiz:{q:'Order after merge?',o:['A. Prod instantly','B. Build artifact → Dev→QA→Staging→Prod','C. Delete code','D. New repo'],a:1,w:'Progressive environments catch bugs.'},happened:'Merge updates main ref → webhook triggers build → artifact promoted through environments.'},
{id:'m11',num:'11',title:'Pull Request anatomy',analogy:'Raising your hand with homework attached for the teacher to compare.',pipe:['feature/order 🌿','PR 🔀','Files+commits 📄','Checks 🤖','Merge ✅'],body:'A <b>PR</b> = request to merge branch A into B. Contains description, commits, changed files, comments, checks, reviewers. GitHub shows green when mergeable.',cmds:['gh pr create --base main','gh pr view'],team:'Nagarjun PRs feature/order → main, tags Samir.',mistake:'Huge 2000-line PRs — keep small for fast review.',quiz:{q:'PR compares…?',o:['A. Two random repos','B. Source branch vs target branch','C. Nothing','D. Issues only'],a:1,w:'GitHub diffs commits + files.'},happened:'GitHub computes merge-base, lists ahead commits + file diff, fires checks.'},
{id:'m12',num:'12',title:'Code review conversation',analogy:'Teacher marks homework in red, you fix and resubmit.',pipe:['PR 📝','Comment 💬','Fix + push 🔧','CI rerun 🤖','Approve ✅'],body:'Reviewers: <b>Approve / Request changes / Comment</b>. Threads resolve. <b>CODEOWNERS</b> auto-assigns folder owners. Required reviewers block merge until they click Approve.',cmds:['gh pr review --approve'],team:'Samir: "move validation to service". Nagarjun fixes, pushes, CI reruns, Samir approves.',mistake:'Merging with unresolved threads — resolve first.',quiz:{q:'Request changes means?',o:['A. Approved','B. Fix needed before merge','C. Closed','D. Deployed'],a:1,w:'Author must update + re-request review.'},happened:'Review state stored per PR; required-review rules gate the Merge button.'},
{id:'m13',num:'13',title:'CI: robot checks homework',analogy:'Robot grades every submission in minutes: spelling (lint), math (tests), safety (scan).',pipe:['Checkout 📥','Lint 🔍','Unit ✅','Security 🛡','Build 🏗'],body:'On PR open, <b>GitHub Actions</b> runs: checkout → install → lint → unit → integration → security → build. Red ❌ blocks merge. Fix, push, robot re-grades.',cmds:['gh run watch'],team:'Priya sees Unit ❌, fixes payment rounding, gets all green.',mistake:'"CI failed, merge anyway" — never on protected main.',quiz:{q:'CI red means?',o:['A. Merge faster','B. PR blocked, fix + push','C. Delete PR','D. Ignore'],a:1,w:'Green checks are merge gates.'},happened:'Webhook → runner VM → workflow YAML steps → status checks posted to PR.'},
{id:'m14',num:'14',title:'Merge strategies: M / S / linear',analogy:'Joining roads: 4-lane junction (merge), single tidy lane (squash), re-paved straight road (rebase).',pipe:['Merge M 🔀','Squash S 🗜','Rebase linear 📏','main advances','History differs'],body:'<b>Merge commit:</b> A→B→C ─→M preserves all. <b>Squash:</b> D+E → one S, clean. <b>Rebase+merge:</b> replay then fast-forward, straight line. Toggle the buttons to compare.',cmds:['git merge feature/x','git merge --squash'],team:'Team uses squash for features, merge commits for releases.',mistake:'Squashing a 3-month epic loses useful history — merge instead.',quiz:{q:'Squash is best for?',o:['A. Long releases','B. Small feature → one clean commit','C. Hotfixes only','D. Never'],a:1,w:'Tidy main, one PR = one commit.'},happened:'Merge creates M with 2 parents; squash creates single S with combined tree.'},
{id:'m15',num:'15',title:'Merge conflict: same line war',analogy:'Two students wrote different answers on the same line. Teacher asks YOU to pick.',pipe:['A edits ✏','B edits ✏','Same line ⚠','Markers shown','Resolved ✅'],body:'Both changed <span class="kbd">name = …</span>. Git inserts <span class="kbd"><<<<<<< HEAD … ======= … >>>>>>></span>. Choose <b>Accept A / B / both / manual</b>, then <span class="kbd">git add + commit + push</span>. PR turns green.',cmds:['git status','git add .','git commit','git push'],team:'Nagarjun vs Samir on config line — Nagarjun keeps both, pushes.',mistake:'Pushing markers (<<<<<<<) to GitHub — resolve fully first.',quiz:{q:'After editing conflicted file?',o:['A. Done','B. git add + commit + push','C. Delete repo','D. Re-clone always'],a:1,w:'Mark resolved, commit the resolution.'},happened:'Git halts merge with unmerged paths; resolution commit has 2 parents.'},
{id:'m16',num:'16',title:'Rebase vs Merge playground',analogy:'Merge = knot tying two ropes. Rebase = untie your rope, extend main rope, re-tie yours on top.',pipe:['main +F 🆕','Merge → M 🪢','Rebase → D’E’ 📏','Toggle 🔀','Compare 📊'],body:'Start main A→B→C, feature D→E. New F lands on main. <b>Merge</b> keeps branch shape + M. <b>Rebase</b> replays D,E as D’,E’ after F — linear but new IDs. Golden rule: never rebase shared history.',cmds:['git merge main','git rebase main'],team:'Ananya rebases private reporting branch, merges shared ones.',mistake:'Rebasing main that others pulled — chaos for teammates.',quiz:{q:'Never rebase…?',o:['A. Private branch','B. Shared/public history','C. Typos','D. Docs'],a:1,w:'Rewriting public IDs confuses everyone.'},happened:'Rebase cherry-picks each commit onto new base, minting new SHAs.'},
{id:'m17',num:'17',title:'Permissions + branch protection 🔒',analogy:'School locks: students read, monitors write, teachers merge. Main door needs 2 keys (review + CI).',pipe:['Try push main ❌','Feature + PR ✅','Review ✅','CI ✅','Merge ✅'],body:'Roles: <b>Owner → Maintainer → Write → Triage → Read</b>. Only some can push/merge/approve. <b>Protection on main:</b> ❌ direct/force push, ✅ 1 approval + CI + scan required. Watch the direct push get BLOCKED.',cmds:['git push origin main'],team:'Vikram tries main → blocked. Opens PR, gets approval, merges.',mistake:'--force to main — can erase teammates’ work.',quiz:{q:'Protect main requires?',o:['A. Nothing','B. PR + approval + green CI','C. Night merges','D. Fork delete'],a:1,w:'Gates keep main always deployable.'},happened:'GitHub pre-receive hooks reject direct pushes; Merge button enables when rules pass.'},
{id:'m18',num:'18',title:'Fork + 300 contributors 🌍',analogy:'Library book everyone photocopies at home (fork), returns suggestions (PRs). Librarians (maintainers) shelve the best.',pipe:['Original 🏛','Fork 🍴','Clone+branch 🌿','PR 🔀','Review+merge 🎉'],body:'Outsiders lack push rights → <b>Fork</b> (server copy) → clone fork → branch → push → PR to original. 300 dots = contributors; only a few PRs merge daily after CI + review. Counters are simulated examples.',cmds:['gh repo fork','git clone <fork>','gh pr create'],team:'External Aisha forks PopularProject, fixes typo, maintainer merges.',mistake:'Cloning original when you can’t push — fork first.',quiz:{q:'Why fork?',o:['A. Faster wifi','B. No push permission on original','C. Avoid CI','D. Delete code'],a:1,w:'Your copy → your branches → PR back.'},happened:'Fork copies refs server-side; PR spans two repos (head fork → base original).'},
{id:'m19',num:'19',title:'Maintainers, CODEOWNERS, Issues',analogy:'Librarians sort request slips (issues), stamp folders to expert shelves (CODEOWNERS).',pipe:['Issue #123 🎫','Labels 🏷','CODEOWNERS 👥','Review 👀','Merge 🎉'],body:'Flow: <b>Issues → labels/milestones → PR → checks → CODEOWNERS review → merge</b>. <span class="kbd">/payment/ @payment-team</span>: touching payment auto-pings them. <span class="kbd">Fixes #123</span> auto-closes the issue on merge. Bots close stale PRs; releases versioned.',cmds:['Fixes #123'],team:'PR touching payment/service.js auto-requires @payment-team (Priya).',mistake:'No issue link — work invisible to planners.',quiz:{q:'PR edits /auth/, owner?',o:['A. Anyone','B. @security-team required','C. Bots','D. Nobody'],a:1,w:'CODEOWNERS maps paths → teams.'},happened:'GitHub matches changed paths vs CODEOWNERS, requests reviews, links commits.'},
{id:'m20',num:'20',title:'Release → envs → hotfix 🔥',analogy:'Toy factory: mold (build) → sticker v1.4.2 (tag) → rehearsal rooms (Dev/QA/Stage) → shop (prod). Fire alarm = hotfix ambulance.',pipe:['main → Build 🏗','Tag v1.4.2 🏷','Dev→QA→Stage','Prod 🌍','Hotfix 🚑'],body:'<b>SemVer Major.Minor.Patch</b> (1.4.2). main → build artifact → Dev → QA → Staging → <b>Production</b> (cloud: AWS/Azure/GCP/BTP/K8s; GitHub orchestrates). <b>Hotfix:</b> main → hotfix/payment-error → fast PR → CI → merge → redeploy.',cmds:['git tag v1.4.2','git push --tags'],team:'Release train ships dashboard; midnight bug takes hotfix lane.',mistake:'Deploying untested main straight to prod.',quiz:{q:'Patch in 1.4.2?',o:['A. 1','B. 4','C. 2','D. 4.2'],a:2,w:'Major.Minor.Patch.'},happened:'Tag points at commit; release bundles artifact; env promotions are deployments.'},
{id:'m21',num:'21',title:'Daily life + escape hatches',analogy:'Morning: sync notebook (pull). Stash = desk drawer for half-done work. Fetch = peek, pull = peek+merge.',pipe:['git pull 🌅','Branch + code ✏','stash 🗄','fetch vs pull 👀','reset vs revert ⚠'],body:'Day: <span class="kbd">pull → switch -c feature → status/add/commit/push → PR → fix → merge</span>. <b>stash:</b> hide work, fix bug, pop back. <b>fetch</b> peeks, <b>pull</b>=fetch+merge. <b>revert</b> = safe undo-commit; <b>reset</b> = move pointer (dangerous). <b>cherry-pick</b> copies one commit.',cmds:['git stash','git stash pop','git fetch','git revert <id>','git cherry-pick <id>'],team:'Rahul stashes login work, hotfixes cart, pops back.',mistake:'git reset --hard on shared branch — teammates lose commits.',quiz:{q:'Safe undo on shared main?',o:['A. reset --hard','B. revert (new commit)','C. delete .git','D. force push'],a:1,w:'Revert adds history; reset rewrites it.'},happened:'stash saves index+worktree; fetch updates origin/*; pull merges; revert inverts a commit.'},
{id:'m22',num:'22',title:'Graphs, parallel PRs, company map',analogy:'Airport board: many planes (PRs) with statuses; org = terminals → gates (teams/repos).',pipe:['Graph 🌐','PR #101✅ #103❌','Org → teams','Mono vs multi 🏢','Click all 👆'],body:'History graph: click commits, see parents. <b>Parallel PRs:</b> #101 approved, #102 review, #103 CI fail, #104 changes requested, #105 draft — click each. <b>Org:</b> org → teams → repos → branches → PRs. <b>Monorepo</b> = one mall; <b>multi-repo</b> = separate shops. <b>Draft PR</b> = "cooking, don’t eat yet".',cmds:['git log --graph','gh pr list'],team:'5 PRs land in different states; leads triage by status.',mistake:'Merging draft PRs — mark ready first.',quiz:{q:'PR #103 CI failed. Merge?',o:['A. Yes','B. No — fix first','C. Convert to draft and merge','D. Close repo'],a:1,w:'Red checks block the Merge button.'},happened:'Graph = DAG of commits; PR states derive from reviews + check runs.'},
{id:'m23',num:'23',title:'Security + CI/CD vs Git + Big picture',analogy:'Airport security: liquids (secrets), luggage X-ray (dependencies), body scan (SAST) before boarding (merge).',pipe:['PR 🔀','Scans 🛡','Approval ✅','Merge → main','Deploy 🚀'],body:'Pipeline: <b>dependency + secret + SAST + container scans → approval</b>. Least privilege + env protection. <b>Git</b>=version control, <b>GitHub</b>=collaboration, <b>Actions/Jenkins</b>=automation, <b>AWS/Azure/BTP/K8s</b>=runtime. You now see the whole airport!',cmds:['git push'],team:'Security bot blocks leaked key; dev rotates secret, green, merge.',mistake:'Committing .env with keys — rotate + scan immediately.',quiz:{q:'Secret in commit. First act?',o:['A. Ignore','B. Rotate secret + revert + scan','C. Push again','D. Share key'],a:1,w:'Leaked secrets must die fast.'},happened:'Scanners run as check suites; failing checks gate merge + deploy.'}

/* ================= animationEngine (stepper) ================= */
let timers={};
function stepperHTML(key,steps){return '<div class="ctrls noPrint" role="group" aria-label="Animation controls"><button class="cbtn primary" data-a="play" data-k="'+key+'">▶ Play</button><button class="cbtn" data-a="pause" data-k="'+key+'">⏸ Pause</button><button class="cbtn" data-a="prev" data-k="'+key+'">⏮ Prev</button><button class="cbtn" data-a="next" data-k="'+key+'">⏭ Next</button><button class="cbtn" data-a="restart" data-k="'+key+'">🔄 Restart</button><button class="cbtn" data-a="slow" data-k="'+key+'">🐢 Slow</button><button class="cbtn" data-a="normal" data-k="'+key+'">▶ Normal</button><button class="cbtn" data-a="fast" data-k="'+key+'">⚡ Fast</button><label class="badge"><input type="checkbox" data-auto="'+key+'" checked> Auto</label></div>'}
const animState={};
function initStepper(key,steps,nodes){animState[key]={i:0,steps,speed:1200,auto:true};renderStep(key,nodes)}
function renderStep(key,nodes){const s=animState[key];if(!s)return;const st=s.steps[s.i];document.querySelectorAll('[data-stage="'+key+'"] .pnode').forEach((n,idx)=>n.classList.toggle('on',idx===s.i));const cap=document.querySelector('[data-cap="'+key+'"]');if(cap)cap.innerHTML='<b>Step '+(s.i+1)+'/'+s.steps.length+': '+st+'</b>';const pk=document.getElementById('packet');if(pk&&key==='big')pk.style.transform='translateX('+(s.i*26)+'px)';if(nodes&&document.body.classList.contains('reduce-motion')===false){const el=document.querySelector('[data-stage="'+key+'"] .pnode.on');if(el){el.classList.remove('move');void el.offsetWidth;el.classList.add('move')}}}
function stepNext(key){const s=animState[key];if(!s)return;s.i=(s.i+1)%s.steps.length;renderStep(key)}
function stepPrev(key){const s=animState[key];if(!s)return;s.i=(s.i-1+s.steps.length)%s.steps.length;renderStep(key)}
function playKey(key){pauseKey(key);const s=animState[key];if(!s||!s.auto)return;timers[key]=setInterval(()=>stepNext(key),s.speed)}
function pauseKey(key){if(timers[key])clearInterval(timers[key])}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const k=b.dataset.k,a=b.dataset.a;if(a==='play')playKey(k);else if(a==='pause')pauseKey(k);else if(a==='next'){pauseKey(k);stepNext(k)}else if(a==='prev'){pauseKey(k);stepPrev(k)}else if(a==='restart'){pauseKey(k);animState[k].i=0;renderStep(k)}else if(a==='slow'){animState[k].speed=2200;playKey(k)}else if(a==='normal'){animState[k].speed=1200;playKey(k)}else if(a==='fast'){animState[k].speed=450;playKey(k)}});
document.addEventListener('change',e=>{const c=e.target.closest('[data-auto]');if(c)animState[c.dataset.auto].auto=c.checked});

const T={branch:'main',branches:['main'],staged:0,commits:['C1 Initial'],remote:true};const el=document.getElementById('term');const print=(c,t)=>el.innerHTML+='<div class="'+c+'">'+t+'</div>';
print('out','🐙 git-sim ready. Type <b>help</b>.');const run=()=>{const raw=document.getElementById('tin').value.trim();if(!raw)return;document.getElementById('tin').value='';print('in','$ '+raw);const[a,b,c,d,e]=raw.split(' ');
if(raw==='help')print('out','Commands: status branch switch log add commit merge push pull fetch remote diff stash');
else if(raw==='git status')print('out','On '+T.branch+' | staged:'+T.staged+' | commits:'+T.commits.length);
else if(raw.startsWith('git branch'))print('out','Branches: '+T.branches.join(', '));
else if(raw.startsWith('git switch')){const n=raw.split(' ').pop();if(!T.branches.includes(n)){T.branches.push(n)}T.branch=n;print('out','Switched to '+n+' (HEAD → '+n+')')}
else if(raw.startsWith('git add')){T.staged++;print('out','Staged → tray ('+T.staged+' files)')}
else if(raw.startsWith('git commit')){if(!T.staged){print('err','Nothing staged! git add first.')}else{T.commits.push('C'+(T.commits.length+1));T.staged=0;print('out','Committed ✅ '+T.commits[T.commits.length-1]+' on '+T.branch)}}
else if(raw.startsWith('git log'))print('out',T.commits.map((x,i)=>'● '+x).join('<br>'));
else if(raw.startsWith('git push'))print('out','⬆ '+T.branch+' → origin/'+T.branch+' ✅');
else if(raw.startsWith('git pull'))print('out','⬇ fetch + merge into '+T.branch+' ✅ up to date');
else if(raw.startsWith('git fetch'))print('out','⬇ origin/* updated. Working files unchanged.');
else if(raw.startsWith('git merge'))print('out','🔀 merged into '+T.branch+' ✅');
else print('err','Unknown (simulated). Try: '+raw);el.scrollTop=el.scrollHeight};

/* ===== Apple-grade motion layer: reveal on scroll + traveling packet + counters ===== */
(function(){const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('reveal');io.unobserve(e.target)}}),{threshold:.08}):null;
function watchReveals(){if(!io)return;document.querySelectorAll('#content .card:not(.reveal)').forEach(c=>io.observe(c))}
const mo=('MutationObserver' in window)?new MutationObserver(()=>{watchReveals();attachTravelers()}):null;
if(mo)mo.observe(document.getElementById('content'),{childList:true,subtree:true});
window.__appleReveal=watchReveals;
function attachTravelers(){document.querySelectorAll('#content .stage').forEach(st=>{const pipe=st.querySelector('.pipe');if(!pipe||st.querySelector('.traveler'))return;const t=document.createElement('div');t.className='traveler';t.setAttribute('aria-hidden','true');pipe.appendChild(t);positionTraveler(st)});
document.querySelectorAll('#content [data-cap]').forEach(()=>{});positionAll()}
function positionTraveler(st){const pipe=st.querySelector('.pipe');const dot=st.querySelector('.traveler');if(!pipe||!dot)return;const on=pipe.querySelector('.pnode.on')||pipe.querySelector('.pnode');if(!on)return;const pr=pipe.getBoundingClientRect(),r=on.getBoundingClientRect();dot.style.left=Math.max(0,(r.left-pr.left+r.width/2-11))+'px'}
function positionAll(){document.querySelectorAll('#content .stage').forEach(positionTraveler)}
window.__positionTravelers=positionAll;
const _rs=renderStep;renderStep=function(k,n){_rs(k,n);requestAnimationFrame(positionAll)};
window.addEventListener('resize',positionAll);
setTimeout(()=>{watchReveals();attachTravelers();positionAll()},60);
setInterval(positionAll,1500);
})();
